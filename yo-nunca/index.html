<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Nunca Nunca 🥂 - Party Edition</title>
    <!-- Tailwind CSS for utility styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen w-screen overflow-x-hidden overflow-y-auto text-white font-jakarta select-none bg-gradient-animated never-theme">
    <a href="../index.html" class="absolute top-4 left-4 inline-flex items-center justify-center w-11 h-11 rounded-full bg-black/40 text-white shadow-lg hover:bg-black/60 transition-all z-50" aria-label="Ir al inicio">🏠</a>

    <!-- GAME CONTAINER -->
    <div id="never-screen" class="h-full w-full flex flex-col items-center justify-center px-6 relative z-10 text-center animate-fade-in">
        
        <!-- Animated Badge Header -->
        <span class="px-4 py-1.5 rounded-full text-xs font-black tracking-widest uppercase bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-6 animate-pulse">
            Yo Nunca Nunca...
        </span>
        
        <!-- Main Interactive Swipe/Fly Card -->
        <div id="never-card" class="w-full max-w-xl bg-gradient-to-b from-slate-900/90 to-indigo-950/90 border-2 border-indigo-500/40 p-8 md:p-12 rounded-3xl min-h-[300px] flex items-center justify-center shadow-[0_0_60px_rgba(99,102,241,0.25)] relative overflow-hidden transition-all duration-300">
            <!-- Background structural glow decoration -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
            
            <p id="never-text" class="text-2xl md:text-4xl font-extrabold font-syne leading-tight tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200 drop-shadow">
                Cargando secretos de la noche...
            </p>
        </div>

        <!-- Conditional Rule Reminder -->
        <p class="text-sm text-indigo-300/60 my-8 tracking-wider font-semibold">
            Si lo has hecho, ¡BEBES! 🍻
        </p>

        <!-- Primary Action Trigger -->
        <div class="flex gap-4">
            <button onclick="nextNeverPhrase()" class="px-10 py-5 bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-600 text-white font-black text-xl rounded-full shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 transform active:scale-95 transition-all tracking-wide">
                Siguiente frase 🥂
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
