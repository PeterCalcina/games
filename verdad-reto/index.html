<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdad o Reto 🔥 - Party Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="min-h-screen w-screen overflow-x-hidden overflow-y-auto text-white font-outfit select-none bg-gradient-animated dynamic-bg normal-theme flex flex-col"
  >
    <a href="../index.html" class="absolute top-4 left-4 inline-flex items-center justify-center w-11 h-11 rounded-full bg-black/40 text-white shadow-lg hover:bg-black/60 transition-all z-50" aria-label="Ir al inicio">🏠</a>
    <div
      id="modes-screen"
      class="h-full w-full flex flex-col items-center justify-center px-6 relative z-10"
    >
      <h1
        class="font-cabinet text-5xl md:text-6xl text-center mb-4 tracking-tight drop-shadow-md"
      >
        VERDAD O RETO
        <span
          class="block text-xl tracking-widest text-purple-300 font-outfit font-semibold mt-2"
          >PARTY EDITION 🔞</span
        >
      </h1>
      <p class="text-purple-200/60 mb-10 text-center text-sm md:text-base">
        Selecciona el nivel de la noche bajo tu propio riesgo.
      </p>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-3xl">
        <button
          onclick="selectMode('normal')"
          class="btn-mode bg-white/10 hover:bg-white/15 border border-white/20 p-6 rounded-2xl text-left transition-all duration-300"
        >
          <span class="text-3xl mb-2 block">😇</span>
          <h3 class="text-xl font-bold">Normal</h3>
          <p class="text-xs text-white/60 mt-1">
            Para calentar motores y romper el hielo sin asustar a nadie.
          </p>
        </button>
        <button
          onclick="selectMode('spicy')"
          class="btn-mode bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 p-6 rounded-2xl text-left transition-all duration-300"
        >
          <span class="text-3xl mb-2 block">🌶️</span>
          <h3 class="text-xl font-bold text-red-400">Picante</h3>
          <p class="text-xs text-white/60 mt-1">
            Subiendo la temperatura. Secretos incómodos y roces físicos.
          </p>
        </button>
        <button
          onclick="selectMode('extreme')"
          class="btn-mode bg-fuchsia-900/40 hover:bg-fuchsia-900/50 border border-fuchsia-500/30 p-6 rounded-2xl text-left transition-all duration-300"
        >
          <span class="text-3xl mb-2 block">😈</span>
          <h3 class="text-xl font-bold text-fuchsia-400">Extremo</h3>
          <p class="text-xs text-white/60 mt-1">
            Sin filtros. 100% explícito, salvaje y solo para degenerados.
          </p>
        </button>
      </div>
    </div>

    <div
      id="choice-screen"
      class="hidden min-h-screen h-full w-full flex flex-col relative z-10 animate-fade-in"
    >
      <button
        onclick="selectOption('dare')"
        class="flex-1 flex items-center justify-center bg-black/10 hover:bg-black/20 active:bg-black/30 transition-all border-b border-white/10 group"
      >
        <span
          class="font-cabinet text-4xl md:text-6xl tracking-wider uppercase group-hover:scale-110 transition-transform text-white/90 drop-shadow"
          >RETO 🔥</span
        >
      </button>

      <div
        class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-white text-slate-900 px-6 py-2.5 rounded-full font-bold text-sm md:text-base shadow-2xl border-4 tracking-widest uppercase border-slate-900 z-20"
      >
        Elige bien
      </div>

      <button
        onclick="selectOption('truth')"
        class="flex-1 flex items-center justify-center bg-black/5 hover:bg-black/15 active:bg-black/25 transition-all group"
      >
        <span
          class="font-cabinet text-4xl md:text-6xl tracking-wider uppercase group-hover:scale-110 transition-transform text-white/90 drop-shadow"
          >VERDAD 🤫</span
        >
      </button>

      <button
        onclick="backToModes()"
        class="absolute top-4 left-4 bg-black/40 hover:bg-black/60 px-4 py-2 rounded-full text-xs font-semibold uppercase tracking-wider backdrop-blur border border-white/10 z-30"
      >
        ← Cambiar Modo
      </button>
    </div>

    <div
      id="prompt-screen"
      class="hidden min-h-screen h-full w-full flex flex-col items-center justify-center px-6 relative z-10 text-center animate-fade-in"
    >
      <h2
        id="prompt-type-title"
        class="font-cabinet text-3xl md:text-5xl uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r mb-6 drop-shadow"
      >
        VERDAD
      </h2>

      <div
        class="w-full max-w-2xl bg-black/30 backdrop-blur-md border border-white/10 p-8 md:p-12 rounded-3xl min-h-[220px] flex items-center justify-center shadow-2xl mb-8"
      >
        <p
          id="prompt-content-text"
          class="text-xl md:text-3xl font-semibold leading-relaxed text-white drop-shadow-sm"
        >
          Texto de la pregunta o reto aquí...
        </p>
      </div>

      <div
        id="timer-wrapper"
        class="hidden mb-8 flex flex-col items-center justify-center"
      >
        <div
          id="timer-container"
          class="w-24 h-24 rounded-full border-4 border-white/30 flex items-center justify-center bg-black/20 backdrop-blur"
        >
          <span
            id="timer-countdown-value"
            class="text-3xl font-black font-cabinet tabular-nums"
            >30</span
          >
        </div>
        <span class="text-[10px] uppercase tracking-wider opacity-60 mt-2"
          >¡Presiona para iniciar el temporizador!</span
        >
      </div>

      <div class="flex gap-4">
        <button
          onclick="nextTurn()"
          class="px-8 py-4 bg-white text-slate-950 font-bold text-lg rounded-full shadow-lg hover:bg-slate-100 transform active:scale-95 transition-all"
        >
          Siguiente
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
