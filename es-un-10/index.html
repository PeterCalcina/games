<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Es un 10 pero...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="h-screen w-screen flex flex-col items-center justify-center relative px-6 text-white overflow-hidden"
  >
    <div
      id="pantalla-inicio"
      class="flex flex-col items-center justify-center text-center transition-all duration-700 w-full max-w-lg z-10"
    >
      <h1
        id="main-title"
        class="title-font text-6xl md:text-7xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-300 animate-waving mb-12 drop-shadow-lg"
      >
        Es un 10 pero...
      </h1>
      <button
        id="btn-jugar"
        onclick="iniciarJuego()"
        class="px-12 py-5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full text-2xl font-bold tracking-wider shadow-lg hover:shadow-purple-500/40 transition-all duration-300 transform active:scale-95"
      >
        JUGAR YA!
      </button>
    </div>

    <div
      id="pantalla-juego"
      class="hidden absolute inset-0 flex flex-col items-center justify-center z-20 cursor-pointer w-full h-full"
      onclick="manejarClickPantalla()"
    >
      <div
        id="instruccion-inicio"
        class="text-center px-6 transition-all duration-500"
      >
        <h2
          class="text-3xl md:text-4xl font-semibold text-purple-100 title-font tracking-wide animate-pulse"
        >
          Presione para empezar
        </h2>
      </div>

      <div
        id="contador"
        class="hidden text-9xl font-black text-white select-none pointer-events-none"
      >
        3
      </div>

      <div
        id="contenedor-carta"
        class="hidden flex flex-col items-center justify-center w-full max-w-sm px-4"
      >
        <div
          id="carta"
          class="card-ratio w-80 bg-white rounded-3xl shadow-2xl flex flex-col justify-between p-6 text-slate-800 border-4 border-purple-500/20 relative select-none"
        >
          <div class="flex flex-col items-center self-start leading-none">
            <span id="carta-valor-sup" class="text-5xl font-black title-font"
              >A</span
            >
            <span id="carta-icono-sup" class="text-3xl mt-1">♣</span>
          </div>
          <div class="flex justify-center items-center w-full my-auto">
            <div
              id="carta-svg-centro"
              class="w-24 h-24 md:w-32 md:h-32 flex items-center justify-center"
            ></div>
          </div>
          <div
            class="flex flex-col items-center self-end leading-none rotate-180"
          >
            <span id="carta-valor-inf" class="text-5xl font-black title-font"
              >A</span
            >
            <span id="carta-icono-inf" class="text-3xl mt-1">♣</span>
          </div>
        </div>
        <p
          id="tap-hint"
          class="text-purple-300/60 mt-8 text-base tracking-wide animate-pulse font-medium"
        >
          Toca la pantalla para la siguiente carta
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
